name: Deploy to Azure Container Apps

# On every push to main (or a manual run): test the app, build the image, push it
# to ACR tagged with the commit SHA, point the Container App at it, and fail the
# run if the new revision doesn't become ready.
#
# Required repository secrets:
#   AZURE_CLIENT_ID        app registration (client) ID of ai-pipeline-generator-github-deploy
#   AZURE_SUBSCRIPTION_ID  target subscription
#   ADMIN_EMAILS           comma-separated sign-in emails of the app's admins (optional)
#
# Required Azure RBAC for the app registration's service principal:
#   AcrPush     on the registry experionaitoolacr
#   Contributor on the resource group rg-ai-devops-tool (or scoped to the Container App)
#
# ANTHROPIC_API_KEY stays as a Container App secret and is not touched here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC login to Azure
  contents: read

# One deploy at a time; a second push waits instead of racing the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_TENANT_ID: 488461c7-ee5c-48eb-8d77-c02b2b2dfdba
  REGISTRY: experionaitoolacr.azurecr.io
  REGISTRY_NAME: experionaitoolacr
  IMAGE_NAME: ai-pipeline-generator
  RESOURCE_GROUP: rg-ai-devops-tool
  CONTAINER_APP_NAME: ai-pipeline-generator

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18 # matches the Dockerfile base image

      - run: npm ci --omit=dev

      - name: Smoke test the server
        run: |
          node --check server/index.js
          AUTH_MODE=basic AUTH_USERNAME=ci AUTH_PASSWORD=ci PORT=8099 node server/index.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 3
          curl -fsS http://localhost:8099/api/health
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8099/)
          test "$code" = "401" || { echo "expected 401 without login, got $code"; exit 1; }

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prints the exact OIDC subject GitHub is sending. The federated credential's
      # "Subject identifier" in Entra ID must match this string character for character.
      - name: Show OIDC subject claim
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq -r '"sub: \(.sub)\naud: \(.aud)\niss: \(.iss)"'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy new image to Container App
        id: deploy
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          # AUTH_MODE=entra: sign-in is handled by the app's built-in Microsoft Entra
          # authentication. ADMIN_EMAILS is only changed when the secret is set.
          ENV_VARS=("AUTH_MODE=entra")
          if [ -n "$ADMIN_EMAILS" ]; then
            ENV_VARS+=("ADMIN_EMAILS=$ADMIN_EMAILS")
          else
            echo "::warning::Repository secret ADMIN_EMAILS is not set - admin emails on the app are left unchanged."
          fi
          REVISION=$(az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --set-env-vars "${ENV_VARS[@]}" \
            --query properties.latestRevisionName -o tsv)
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Created revision $REVISION"

      - name: Wait for the new revision to become ready
        run: |
          REVISION="${{ steps.deploy.outputs.revision }}"
          for i in $(seq 1 20); do
            READY=$(az containerapp show \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query properties.latestReadyRevisionName -o tsv)
            echo "[$i/20] latest ready revision: $READY (waiting for $REVISION)"
            if [ "$READY" = "$REVISION" ]; then
              echo "Revision $REVISION is ready."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Revision $REVISION did not become ready within 5 minutes. Recent logs:"
          az containerapp logs show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision "$REVISION" --tail 50 || true
          exit 1

      - name: Azure logout
        if: always()
        run: az logout || true
